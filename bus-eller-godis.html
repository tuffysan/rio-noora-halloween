'use strict';

const houses=[{color:'#e9a044',roof:'#84502b',name:'Morbrors godishus',owner:'morbror',give:8},{color:'#7b6ba5',roof:'#403261',name:'Louises spökhus',owner:'louise',give:0},{color:'#d39049',roof:'#70452c',name:'Morbrors pumpahus',owner:'morbror',give:6},{color:'#689382',roof:'#34584c',name:'Louises mystiska stuga',owner:'louise',give:0},{color:'#956ca8',roof:'#513565',name:'Morbrors godisslott',owner:'morbror',give:10},{color:'#b57477',roof:'#66374c',name:'Louises busiga hus',owner:'louise',give:0},{color:'#6599aa',roof:'#31566e',name:'Morbrors månhus',owner:'morbror',give:7},{color:'#d39b58',roof:'#7e4b2e',name:'Morbrors stora godisfest',owner:'morbror',give:12}];

function beep(f){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.2)}catch(e){}}

function begin(){$('story').classList.remove('hidden');$('actions').classList.remove('hidden');$('footer').classList.remove('hidden');angry=false;index=0;candies=0;tricks=0;state='approach';visitor=null;particles=[];$('overlay').classList.add('hide');hud();say('🏠 '+houses[index].name+'! Tryck på KNACKA PÅ!');actions([['🚪 Knacka på!',knock,true]])}
function knock(){if(state!=='approach')return;state='knocking';say('🚪 KNACK, KNACK, KNACK!');beep(320);setTimeout(()=>{if(state!=='knocking')return;visitor=houses[index].owner;const h=houses[index];if(h.give){state='candy';candies+=h.give;hud();say('🥰 Morbror: ”Klart ni ska ha godis!” '+h.give+' godisar till Rio och Noora! 🍬');burst('🍬',450,230,20);beep(900);actions([['🍬 Tack så mycket!',next,true]])}else{state='trick';say('🙅‍♀️ Louise: ”Nej, inget godis idag!” Välj ett roligt bus!');actions(prankNames.map((name,i)=>[name,()=>prank(i),i===0]))}},900)}
function prank(i){if(state!=='trick')return;selectedTrick=i;state='chase';angry=true;tricks++;hud();say('😠 Louise: ”HÖRRNI!” Nu jagar hon er! SPRING!');burst(prankIcons[i],450,270,18);beep(220);hideSpot=(index+selectedTrick)%3;runStart=clock;chaseStart=clock;chaseDeadline=clock+6500;chaserX=450;chaserY=340;caught=0;runProgress=0;actions([]);say('😱 SPRING! Tryck på ett gömställe innan husägaren hinner ikapp!')}

function finishHide(){if(state!=='running')return;if(hideChoice===hideSpot){state='hidden';angry=false;say('🤫 Puh! Louise hittade dem inte och gick hem igen!');burst('✨',runTo,400,12);beep(830);actions([['🏠 Smyg till nästa hus ➜',next,true]])}else{state='chase';say('😱 Louise såg dem! Skynda till ett annat gömställe!');beep(250);burst('💨',runTo,440,9);hideSpot=(hideSpot+1)%3;chaseDeadline=clock+4500;chaseStart=clock;runStart=clock}}
function caughtByOwner(){if(state!=='chase'&&state!=='running')return;state='caught';caught++;angry=true;beep(180);burst('💥',450,410,15);say('😆 AJDÅ! Louise hittade er! Spring igen!');actions([['💨 Spring igen!',()=>{state='chase';chaseStart=clock;chaseDeadline=clock+6500;chaserX=450;chaserY=340;runProgress=0;actions([]);say('😱 Skynda! Tryck på ett gömställe i bilden!')},true]])}
function next(){if(state!=='candy'&&state!=='hidden')return;if(index===houses.length-1){state='finished';say('🏆 Rio och Noora klarade hela Halloweenkvarteret!');$('title').textContent='🏆 Vilket Halloweenäventyr!';$('intro').textContent='Rio och Noora samlade '+candies+' godisar och gjorde '+tricks+' roliga bus! 🎉';$('start').textContent='🎃 Spela igen';$('overlay').classList.remove('hide');actions([]);burst('🍬',450,200,40);return}index++;visitor=null;angry=false;state='approach';hud();say('🏠 '+houses[index].name+'! Vågar ni knacka?');actions([['🚪 Knacka på!',knock,true]])}
$('start').onclick=begin;$('restart').onclick=()=>{state='menu';$('story').classList.add('hidden');$('actions').classList.add('hidden');$('footer').classList.add('hidden');$('title').textContent='Bus eller godis!';$('intro').textContent='Knacka på åtta dörrar, samla godis och gör snälla bus!';$('start').textContent='▶ Börja äventyret!';$('overlay').classList.remove('hide');actions([['🚪 Knacka på!',knock,true]])};$('audio').onclick=()=>{sound=!sound;$('audio').textContent=sound?'🔊 Ljud på':'🔇 Ljud av';beep(700)};
cv.addEventListener('pointerdown',e=>{if(state==='approach'){knock();return}if(state==='chase'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*580/r.height;if(y<250)return;const spots=[155,740,790];let n=spots.reduce((best,v,i)=>Math.abs(v-x)<Math.abs(spots[best]-x)?i:best,0);if(x>540&&x<680)n=2;hide(n)}});
function circle(x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function box(x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function emoji(s,x,y,size){c.font=size+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y)}
function character(x,y,row){c.save();c.translate(x,y+Math.sin(clock*.004+row)*4);circle(0,52,43,'#140c2c66');if(art.complete&&art.naturalWidth)c.drawImage(art,Math.floor(clock/550)%2*128,row*128,128,128,-83,-110,166,166);else emoji(row?'🧙‍♀️':'🧛‍♂️',0,-16,96);c.restore()}
function adult(who,x,y,angry=false,scale=1){c.save();c.translate(x,y);c.scale(scale,scale);
const man=who==='morbror';
box(-39,14,78,74,20,man?'#192e43':'#25344d');
circle(0,-20,46,'#f2c7ac');
if(man){circle(0,-3,33,'#a95c30');circle(0,-24,37,'#f2c7ac');box(-46,-88,92,15,8,'#ffe42c');circle(0,-83,43,'#ffe52b');emoji('🙂',0,-38,36);c.fillStyle='#ad6538';c.beginPath();c.ellipse(0,6,31,21,0,0,Math.PI*2);c.fill();emoji('🍬',43,34,33)}
else{c.fillStyle='#d7a66f';c.beginPath();c.ellipse(0,-61,42,38,0,0,Math.PI*2);c.fill();circle(0,-23,39,'#f3cfb6');circle(25,-81,20,'#d7a66f');emoji(angry?'😠':'🙅‍♀️',0,-24,39)}
c.restore()}
function draw(){const h=houses[index],gradient=c.createLinearGradient(0,0,0,580);gradient.addColorStop(0,'#251a53');gradient.addColorStop(.6,'#6e3a72');gradient.addColorStop(1,'#ae5b6a');c.fillStyle=gradient;c.fillRect(0,0,900,580);circle(730,94,61,'#ffebaf');circle(730,94,79,'#fff0b51b');for(let i=0;i<35;i++){const x=(i*127+33)%900,y=(i*83+29)%310;circle(x,y,1+(i%3),'#fff3c7a0')}emoji('🦇',135,95,43);emoji('🦇',620,150,30);emoji('🌲',110,315,130);emoji('🌲',810,315,125);
c.fillStyle='#272141';c.beginPath();c.moveTo(0,430);c.quadraticCurveTo(450,370,900,430);c.lineTo(900,580);c.lineTo(0,580);c.fill();
c.fillStyle='#766076';c.beginPath();c.moveTo(360,580);c.lineTo(405,362);c.lineTo(495,362);c.lineTo(540,580);c.fill();
box(278,160,345,250,15,h.color);c.fillStyle=h.roof;c.beginPath();c.moveTo(246,177);c.lineTo(449,43);c.lineTo(654,177);c.fill();box(412,251,82,159,14,'#382647');box(427,266,53,144,12,visitor?'#66417c':'#21152d');circle(478,335,6,'#ffd278');
for(const x of [315,550]){box(x,225,48,63,8,'#34224a');box(x+6,232,36,50,6,'#ffe39b');c.strokeStyle='#6b4171';c.lineWidth=5;c.beginPath();c.moveTo(x+24,233);c.lineTo(x+24,281);c.moveTo(x+5,255);c.lineTo(x+43,255);c.stroke()}
emoji('🎃',245,403,69);emoji('🎃',658,404,64);emoji('🕸️',337,185,47);emoji('🕯️',591,400,36);
if(visitor){adult(visitor,452,320,angry);if(angry){emoji('💢',535,215,52);emoji('💢',365,218,39)}}if(state==='chase'||state==='running'||state==='hidden'){for(let i=0;i<6;i++)emoji(prankIcons[selectedTrick],300+i*57,185+Math.sin(clock*.005+i)*20,43)}if(state==='chase'||state==='running'){const remain=Math.max(0,(chaseDeadline-clock)/1000);box(248,50,404,32,13,'#28143bdc');box(254,56,392*Math.min(1,remain/6.5),20,9,remain<2?'#ff6262':'#76e5a5');c.font='bold 24px system-ui';c.textAlign='center';c.fillStyle='#fff';c.fillText('⏳ '+remain.toFixed(1)+' sekunder',450,78);emoji('💨',330,470,57);emoji('💨',565,470,57);box(210,95,480,64,18,'#751f38eb');c.font='bold 29px system-ui';c.textAlign='center';c.fillStyle='#fff3ae';c.fillText(state==='chase'?'👆 TRYCK PÅ ETT GÖMSTÄLLE!':'💨 SPRINGER OCH GÖMMER SIG!',450,135);if(state==='chase'){for(const [x,y,sym] of [[155,440,'🎃'],[740,345,'🌳'],[790,445,'🌿']]){circle(x,y,65,'#fff1a550');emoji(sym,x,y,85);emoji('👇',x,y-94+Math.sin(clock*.007)*8,42)}}}if(state==='chase'||state==='running'){const tx=state==='running'?450+(runTo-450)*runProgress:450;chaserX+=(tx-chaserX)*.025;adult('louise',chaserX,385+Math.sin(clock*.024)*9,true,.75);emoji('💢',chaserX+46,328,33)}if(state==='caught'){adult('louise',450,405,true,1.1);emoji('😵',550,468,60)}if(state==='hidden'){emoji(hiding[hideChoice].split(' ')[0],455,480,100);emoji('🤫',450,375,55)}
if(state==='approach'){box(315,173,270,55,20,'#251739e0');c.font='bold 26px system-ui';c.textAlign='center';c.fillStyle='#ffe7a5';c.fillText('👆 KNACKA PÅ!',450,208)}
if(state==='knocking'){emoji('💥',450,330,70);c.font='bold 35px system-ui';c.fillStyle='#fff0a4';c.textAlign='center';c.fillText('KNACK KNACK!',450,225)}
const runX=state==='running'?450+(runTo-450)*runProgress:state==='hidden'?runTo:450;const sprint=state==='running'||state==='chase';character(sprint?runX-65:310,sprint?495-Math.sin(clock*.035)*10:501,0);character(sprint?runX+65:575,sprint?495+Math.sin(clock*.035)*10:501,1);emoji('🍬',242,487,40);emoji('🍭',650,485,40);

function frame(t){const dt=Math.min(45,t-last||16);last=t;clock+=dt;if(state==='running'){runProgress=Math.min(1,(clock-runStart)/1400);if(runProgress>=1)finishHide()}if((state==='chase'||state==='running')&&clock>=chaseDeadline)caughtByOwner();for(const p of particles){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.18*dt/16;p.life-=dt}particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);
